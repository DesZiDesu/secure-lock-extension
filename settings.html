<div id="secure-lock-settings-root" class="secure-lock-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Secure Lock</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="secure-lock-settings__intro">
                <div>
                    <strong>Secure Lock</strong>
                    <div class="secure-lock-settings__meta">Foundation v{{version}}</div>
                </div>
                <span class="secure-lock-settings__badge">Ready</span>
            </div>

            <label class="checkbox_label secure-lock-settings__toggle" for="secure-lock-enabled">
                <input id="secure-lock-enabled" type="checkbox" />
                <span>Enable Secure Lock</span>
            </label>

            <p class="secure-lock-settings__note">
                Base extension shell is installed. Interactive roleplay components will be added in later stages.
            </p>
        </div>
    </div>
</div>
